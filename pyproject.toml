[project]
name = "apply-pipeline"
version = "0.1.0"
description = "AI-powered job vacancy aggregation, filtering, and evaluation pipeline"
readme = "README.md"
authors = [
    { name = "Andrew", email = "malyi.andrew@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic-ai-slim[anthropic,openai]>=2.46.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "scripts", "tests", "migrations"]
# Name modules by their path (tests.integration.conftest), so the two conftest.py
# files do not clash; the package itself is found through src.
mypy_path = "src"
explicit_package_bases = true

[tool.importlinter]
root_package = "apply_pipeline"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["apply_pipeline"]
layers = [
    "entrypoints",
    "services",
    "adapters",
    "domain",
]

[[tool.mypy.overrides]]
# The docker SDK (pulled in by testcontainers) ships without type hints.
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# One event loop for the whole run: the database engine is created once per session.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: runs against a real PostgreSQL started in Docker by testcontainers",
]
